<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabellen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #333;
            color: #f0f0f0;
            text-align: center;
            margin: 20px;
        }
        .container {
            margin-top: 20px;
            padding: 20px;
            background-color: #444;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
        }
        .tab-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
        .tab-button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            cursor: pointer;
            background-color: #555;
            color: #f0f0f0;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .tab-button:hover, .tab-button.active {
            background-color: #5a8ff0;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 10px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <h1>Tabellen Übersicht</h1>
    <div class="container">
        <div class="tab-container">
            <button class="tab-button active" onclick="openTab('main')">Hauptseite</button>
            <button class="tab-button" onclick="openTab('chemikalien')">Chemikalienliste</button>
        </div>

        <div id="main" class="tab-content active">
            <h2>Hauptseite</h2>
            <iframe src="tabeller_main.html"></iframe>
        </div>

        <div id="chemikalien" class="tab-content">
            <h2>Chemikalienliste</h2>
            <iframe src="chemikalienliste.html"></iframe>
        </div>
    </div>

    <script>
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(button => {
                button.classList.remove('active');
            });

            document.getElementById(tabName).classList.add('active');
            document.querySelector(`[onclick="openTab('${tabName}')"]`).classList.add('active');
        }
    </script>
</body>
</html>
